          - Input and gamepad: modules/player/input.md
          - Movement: modules/player/movement.md
          - Animator and Foot IK: modules/player/animator.md
          - Camera: modules/player/camera.md
      - Vitals: modules/vitals.md
      - Inventory:
          - Items: modules/inventory/index.md
          - Containers and hotbar: modules/inventory/containers.md
          - Item in the hand: modules/inventory/held-item.md
          - Items in the world: modules/inventory/world-items.md
      - Save: modules/save.md
      - Combat:
          - Overview: modules/combat/index.md
          - Melee: modules/combat/melee.md
          - Ranged weapons: modules/combat/ranged.md
      - Effects: modules/effects.md
      - Equipment: modules/equipment.md
      - Temperature: modules/temperature.md
      - Weather: modules/weather.md
      - Crafting: modules/crafting.md
      - Building:
          - Overview: modules/building/index.md
          - Build pieces: modules/building/pieces.md
          - Rules, health and support: modules/building/rules.md
          - Ward: modules/building/ward.md
      - AI: modules/ai.md
      - Gathering: modules/gathering.md
      - Vehicle:
          - Overview: modules/vehicle/index.md
          - Vehicle Definition: modules/vehicle/definition.md
